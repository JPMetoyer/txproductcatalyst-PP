# Free-tier Supabase projects pause after ~7 days without activity (e.g. winter/summer break).
# This pings Studio's /api/health every 3 days, which runs one tiny database query.
#
# Note: GitHub turns off scheduled workflows in repositories with no commits for 60 days and emails
# the repo owner. If that happens, open the Actions tab → Keep Supabase awake → "Enable workflow".
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 14 */3 * *' # every 3 days, 14:17 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          # Set a repository variable STUDIO_URL (Settings → Secrets and variables → Actions → Variables)
          # if Studio isn't at the default address yet (e.g. https://tpc-studio.pages.dev).
          STUDIO_URL: ${{ vars.STUDIO_URL || 'https://studio.texasproductcatalyst.com' }}
        run: |
          curl --fail --silent --show-error --max-time 30 --retry 3 --retry-delay 20 "$STUDIO_URL/api/health"
